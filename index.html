<script>
    function switchLang(lang) {
      document.querySelectorAll('.content-panel').forEach(panel => {
        panel.classList.remove('active');
      });
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });

      const activePanel = document.getElementById('panel-' + lang);
      if (activePanel) {
        activePanel.classList.add('active');
      }

      const activeBtn = document.querySelector(`.tab-btn[data-lang="${lang}"]`);
      if (activeBtn) {
        activeBtn.classList.add('active');
      }
    }

    // Lista de países de língua espanhola (ISO-2)
    const spanishCountries = [
      'ES', 'MX', 'AR', 'CO', 'CL', 'PE', 'VE', 'EC', 'GT', 
      'CU', 'BO', 'DO', 'HN', 'PY', 'SV', 'NI', 'CR', 'PR', 'PA', 'UY', 'GQ'
    ];

    // Detecta o idioma com base em: Idioma do Sistema + Fuso Horário + País via IP
    async function detectLanguageAndRegion() {
      // 1. Idioma do Navegador/Dispositivo
      const userLang = (navigator.language || (navigator.languages && navigator.languages[0]) || 'en').toLowerCase();
      
      // 2. Fuso Horário Local (útil para PCs e notebooks)
      let timeZone = '';
      try {
        timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
      } catch (e) {}

      // Decisão preliminar imediata (zero delay)
      if (userLang.startsWith('pt') || timeZone.includes('Sao_Paulo') || timeZone.includes('Recife') || timeZone.includes('Lisbon')) {
        switchLang('pt');
      } else if (userLang.startsWith('es') || timeZone.includes('Madrid') || timeZone.includes('Buenos_Aires') || timeZone.includes('Mexico_City')) {
        switchLang('es');
      } else {
        switchLang('en');
      }

      // 3. Verificação por Região Geográfica (IP Geolocation em background)
      try {
        const response = await fetch('https://ipapi.co/json/', { cache: 'no-store' });
        if (response.ok) {
          const data = await response.json();
          const country = (data.country_code || '').toUpperCase();

          if (country === 'BR' || country === 'PT') {
            switchLang('pt');
          } else if (spanishCountries.includes(country)) {
            switchLang('es');
          } else {
            switchLang('en');
          }
        }
      } catch (err) {
        // Se a requisição de IP falhar (ex: offline ou adblocker),
        // mantém a seleção feita pelo navegador/fuso horário sem causar erro.
      }
    }

    document.addEventListener('DOMContentLoaded', detectLanguageAndRegion);
  </script>
