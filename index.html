<script>
    function switchLang(lang) {
      document.querySelectorAll('.content-panel').forEach(panel => {
        panel.classList.remove('active');
        panel.style.display = 'none';
      });
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });

      const activePanel = document.getElementById('panel-' + lang);
      if (activePanel) {
        activePanel.classList.add('active');
        activePanel.style.display = 'block';
      }

      const activeBtn = document.querySelector(`.tab-btn[data-lang="${lang}"]`);
      if (activeBtn) {
        activeBtn.classList.add('active');
      }
    }

    const spanishCountries = [
      'ES', 'MX', 'AR', 'CO', 'CL', 'PE', 'VE', 'EC', 'GT', 
      'CU', 'BO', 'DO', 'HN', 'PY', 'SV', 'NI', 'CR', 'PR', 'PA', 'UY', 'GQ'
    ];

    // Fallback: usado apenas se o IP/VPN falhar ou estiver sem internet
    function fallbackByBrowser() {
      const langs = navigator.languages ? Array.from(navigator.languages) : [navigator.language || 'en'];
      const primaryLang = (langs[0] || '').toLowerCase();

      if (primaryLang.startsWith('pt')) return 'pt';
      if (primaryLang.startsWith('es')) return 'es';
      return 'en';
    }

    async function detectLanguageAndRegion() {
      // 1. Tenta identificar o país da VPN primeiro (Prioridade Máxima)
      try {
        const res = await fetch('https://ipwho.is/');
        if (res.ok) {
          const data = await res.json();
          if (data && data.success !== false) {
            const country = (data.country_code || '').toUpperCase();

            // Se o VPN for Brasil ou Portugal -> Português
            if (country === 'BR' || country === 'PT') {
              switchLang('pt');
              return;
            }

            // Se o VPN for Espanha ou América Latina Hispânica -> Espanhol
            if (spanishCountries.includes(country)) {
              switchLang('es');
              return;
            }

            // Qualquer outro país (EUA, Alemanha, França, Reino Unido, etc.) -> Inglês
            switchLang('en');
            return;
          }
        }
      } catch (e) {
        // Se a chamada de IP falhar (ex: bloqueador de scripts ou sem rede), cai no fallback
      }

      // 2. Se a detecção por IP falhar, usa a configuração local do navegador
      switchLang(fallbackByBrowser());
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', detectLanguageAndRegion);
    } else {
      detectLanguageAndRegion();
    }
  </script>
